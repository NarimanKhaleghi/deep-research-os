[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "deep-research-os"
version = "1.3.0"
description = "A self-improving, agent-native research skill: evidence ledger, verification gates, contradiction detection and a governed continuous-learning loop. Works keyless out of the box."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "deep-research-os contributors" }]
keywords = ["agent-skills", "deep-research", "mcp", "research", "llm-agents"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
  "httpx>=0.27,<1.0",
  "trafilatura>=1.8,<3.0",
  "pymupdf>=1.24,<2.0",
  "pydantic>=2.7,<3.0",
  "jsonschema>=4.22,<5.0",
  "rapidfuzz>=3.9,<4.0",
  "tenacity>=8.3,<10.0",
  "jinja2>=3.1,<4.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.2,<9.0"]

[project.scripts]
research-os = "scripts.research_ctl:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools]
packages = ["scripts", "scripts.lib", "scripts.connectors", "scripts.core", "scripts.learning"]
