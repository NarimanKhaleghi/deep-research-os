name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Unit + integration tests (offline)
        env:
          RESEARCH_OS_OFFLINE: "1"
        run: pytest -q
      - name: Behavior evals (offline)
        env:
          RESEARCH_OS_OFFLINE: "1"
        run: python evals/run_evals.py --offline
      - name: CLI smoke (offline)
        env:
          RESEARCH_OS_OFFLINE: "1"
          RESEARCH_OS_HOME: /tmp/dros-ci-home
          RESEARCH_OS_VAULT: /tmp/dros-ci-vault
        run: |
          python scripts/research_ctl.py init "CI smoke question" --profile quick \
            --angles "a;b" --success "smoke" >/dev/null
          python scripts/research_ctl.py status >/dev/null
          python scripts/research_ctl.py doctor --no-write >/dev/null
